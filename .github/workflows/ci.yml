name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    # tilework gem (core/): 実 GPU 不要なテストのみ。ユニットテスト (方言/
    # コード生成のアサート等) と、:cpu バックエンドで実際に GPU.kernel {} /
    # Ops を実行して数値結果を検証するテスト (test/**/*_cpu_test.rb) の両方
    # が rake test 1 本に含まれる (CLAUDE.md#Testing)。ubuntu ランナーで足りる。
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ruby: ["3.1", "3.2", "3.3"]
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
          working-directory: core
      - name: Run core test suite
        working-directory: core
        run: bundle exec rake test
      - name: Generate core API reference
        working-directory: core
        run: bundle exec rake yard

  metal:
    # tilework-metal gem (metal/): :metal 統合テスト (rake test:metal) は
    # Apple Silicon + Metal 実機が要るため CI では動かせない。ここで動かす
    # のは拡張のビルド (extconf.rb が非 macOS では no-op Makefile を書く)
    # と、GPU_TESTS=1 なしで実行される rake test だけ — gpu_tests_enabled?
    # のガードで実機依存のテストは skip される (CLAUDE.md#Testing)。この
    # ジョブが検証するのは、gem がロードでき、拡張なしでも壊れないこと。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: metal
      - name: Build extension (no-op off macOS)
        working-directory: metal
        run: bundle exec rake compile
      - name: Run metal test suite
        working-directory: metal
        run: bundle exec rake test
      - name: Generate Metal API reference
        working-directory: metal
        run: bundle exec rake yard

  cuda:
    # tilework-cuda gem (cuda/): :cuda 統合テスト (rake test:cuda) は NVIDIA
    # GPU + CUDA Toolkit 実機が要るため CI では動かせない。ここで動かすのは
    # 拡張のビルド (extconf.rb は CUDA_HOME/nvcc が無ければ no-op Makefile を
    # 書く) と、GPU_TESTS=1 なしで実行される rake test だけ —
    # gpu_tests_enabled? のガードで実機依存のテストは skip される
    # (CLAUDE.md#Testing)。metal ジョブと同じ理由で、このジョブが検証するの
    # は「gem がロードでき、拡張なしでも壊れないこと」。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: cuda
      - name: Build extension (no-op without a CUDA toolchain)
        working-directory: cuda
        run: bundle exec rake compile
      - name: Run cuda test suite
        working-directory: cuda
        run: bundle exec rake test
      - name: Generate CUDA API reference
        working-directory: cuda
        run: bundle exec rake yard

  hip:
    # tilework-hip gem: ROCm 実機を持たない通常の Linux CI でも、extconf の
    # no-op build、未ビルド extension の actionable DeviceError、gem 側の
    # Ruby テストを必ず検証する。実 HIP conformance は資格環境の手動 job で
    # GPU_TESTS=1 GPU_BACKEND=hip rake test:hip を実行する。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: hip
      - name: Build extension (no-op without ROCm)
        working-directory: hip
        run: bundle exec rake compile
      - name: Run HIP no-device test suite
        working-directory: hip
        run: bundle exec rake test
